version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      nuxt:
        patterns: ["nuxt", "vue", "vue-router", "@nuxt/*", "ofetch"]
    ignore:
      # Types for the Node.js version in the Dockerfile.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # vue-tsc (nuxt typecheck) doesn't run on TypeScript 7 yet.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    ignore:
      # Stay on the Node.js LTS line; move majors by hand.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
